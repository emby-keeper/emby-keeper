name: Windows Release

on:
  workflow_dispatch:
  release:
    types: [released]

env:
  WIN_SCRIPT_ZIP_NAME: 'embykeeper-win-online-${{ github.ref_name }}.zip'
  WIN_PORTABLE_ZIP_NAME: 'embykeeper-win-${{ github.ref_name }}.zip'

permissions:
  contents: write

jobs:
  win-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive online installer
        working-directory: windows/installer-script
        run: |
          sed -n 's/^version = "\(.*\)"/\1/p' ../../pyproject.toml > version.txt
          zip "$WIN_SCRIPT_ZIP_NAME" Start-Embykeeper.bat install.ps1 version.txt
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WIN_SCRIPT_ZIP_NAME }}
          path: windows/installer-script/${{ env.WIN_SCRIPT_ZIP_NAME }}
      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "windows/installer-script/$WIN_SCRIPT_ZIP_NAME" --repo "${{ github.repository }}"

  win-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build panel frontend and wheel
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build
          New-Item -ItemType Directory -Force embykeeperapi/static | Out-Null
          Copy-Item frontend/dist/* embykeeperapi/static -Recurse -Force
          Copy-Item windows/installer-gui/Resources/logo.ico embykeeperapi/static/tray.ico
          python -m pip install build
          python -m build --wheel
      - name: Upload wheel for manual testing
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: embykeeper-wheel-${{ github.ref_name }}
          path: dist/*.whl
      - name: Test embedded Python online installation
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          ./windows/installer-script/install.ps1 -InstallOnly -PackagePath $wheel -InstallDirectory "$env:RUNNER_TEMP/embykeeper-test"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = "$env:RUNNER_TEMP/embykeeper-test/python-3.11.9/python.exe"
          & $python -c "import pystray; from embykeeperapi.app import _resolve_static_dir; p = _resolve_static_dir(); assert p and (p / 'index.html').is_file() and (p / 'tray.ico').is_file()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build compact portable package
        shell: pwsh
        run: |
          $version = (Select-String '^version = "(.*)"' pyproject.toml).Matches.Groups[1].Value
          python windows/portable/pack.py --runtime "$env:RUNNER_TEMP/embykeeper-test/python-3.11.9" --installer windows/installer-script --version $version --output "dist/$env:WIN_PORTABLE_ZIP_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content "dist/$([IO.Path]::GetFileNameWithoutExtension($env:WIN_PORTABLE_ZIP_NAME)).json" -Raw | ConvertFrom-Json
          "## Windows portable package`nFiles: $($report.before.files) -> $($report.after.files)`nZIP size: $($report.archive_bytes) bytes" >> $env:GITHUB_STEP_SUMMARY
      - name: Test the extracted portable package
        shell: pwsh
        run: |
          $portable = "$env:RUNNER_TEMP/embykeeper-portable"
          Expand-Archive "dist/$env:WIN_PORTABLE_ZIP_NAME" $portable
          & "$portable/install.ps1" -InstallOnly -InstallDirectory "$env:RUNNER_TEMP/embykeeper-portable-data"
          & "$portable/runtime/python.exe" windows/portable/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload portable package for manual testing
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WIN_PORTABLE_ZIP_NAME }}
          path: |
            dist/${{ env.WIN_PORTABLE_ZIP_NAME }}
            dist/*.json
          compression-level: 0
      - name: Upload portable package to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload "${{ github.ref_name }}" "dist/$env:WIN_PORTABLE_ZIP_NAME" --repo "${{ github.repository }}"
